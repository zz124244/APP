<script>
  var q = new URLSearchParams(location.search)
  var w = parseInt(q.get('w') || '390', 10), h = parseInt(q.get('h') || '844', 10), flow = q.get('flow') || 'login'
  var scale = Math.min(1, (window.innerHeight - 4) / h)
  var f = document.createElement('iframe')
  f.width = w; f.height = h
  f.style.width = w + 'px'; f.style.height = h + 'px'
  f.style.transformOrigin = 'top left'
  f.style.transform = 'scale(' + scale + ')'
  f.src = '/index.html?flow=' + encodeURIComponent(flow)
  document.body.appendChild(f)
  window.addEventListener('message', function (e) {
    var pre = document.getElementById('__audit')
    if (!pre) { pre = document.createElement('pre'); pre.id = '__audit'; document.body.appendChild(pre) }
    pre.textContent = e.data
  })
