<!doctype html>
<html>
<head><meta charset="utf-8"><title>zoom simulation</title>
<style>
  html,body{margin:0;background:#111;height:100%}
  .screen{position:relative;width:390px;height:844px;overflow:hidden;background:#000}
  .screen iframe{position:absolute;top:0;right:0;width:390px;height:844px;border:0;transform-origin:top right}
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search)
  var z = parseFloat(q.get('z') || '1.08')
  var flow = q.get('flow') || 'login'
  var f = document.createElement('iframe')
  f.src = '/index.html?flow=' + encodeURIComponent(flow)
  f.style.transform = 'scale(' + z + ')'
  var s = document.createElement('div')
  s.className = 'screen'
  s.appendChild(f)
  document.body.appendChild(s)
</script>
</body>
</html>
